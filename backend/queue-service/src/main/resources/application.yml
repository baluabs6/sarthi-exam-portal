server:
  port: 8081

spring:
  application:
    name: queue-service

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/sarthi_audit}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

# Admission throttle: this is the single knob that controls how much
# concurrent load ever reaches result-service/Postgres. Lower it during
# a known-fragile deployment; raise it once you've verified downstream
# capacity headroom (see README for load-testing notes).
queue:
  admit-per-tick: 5
  tick-interval-seconds: 2

# Shared secret used to sign admission tickets — result-service must be
# configured with the EXACT same value (ticket.signing-secret there) or
# ticket verification will fail. Always override via the
# TICKET_SIGNING_SECRET env var in any real deployment; the default here
# is only safe for local dev.
ticket:
  signing-secret: ${TICKET_SIGNING_SECRET:dev-only-insecure-secret-change-me-before-deploying}
  ttl-seconds: 900

# CORS/WebSocket origin allowlist — comma-separated. Must match wherever
# the frontend is actually served from.
security:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}

# Shared admin key gating /api/admin/** — see AdminAuthInterceptor.
# For real per-account roles, set ADMIN_ACCOUNTS_JSON instead — e.g.
# '[{"key":"...","name":"Priya (Ops)","role":"SUPER_ADMIN"},
#   {"key":"...","name":"Raj (Operator)","role":"QUEUE_OPERATOR"}]'
# Valid roles: SUPER_ADMIN, QUEUE_OPERATOR (can tune admission rate),
# AUDITOR (read-only). If unset, admin.api-key below is used as a
# single SUPER_ADMIN account, for backward compatibility.
admin:
  api-key: ${ADMIN_API_KEY:dev-only-insecure-admin-key-change-me}
  accounts-json: ${ADMIN_ACCOUNTS_JSON:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
