name: Dependency Vulnerability Scan

# Runs on every push/PR, plus a weekly schedule so newly disclosed CVEs
# in already-approved dependencies get caught even without a code change.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

jobs:
  java-dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: OWASP Dependency-Check (backend)
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: sarthi-exam-portal-backend
          path: backend
          format: HTML
          args: >
            --failOnCVSS 8
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/

  frontend-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: npm audit (frontend)
        working-directory: frontend
        run: |
          npm install --package-lock-only
          npm audit --audit-level=high

  container-image-scan:
    runs-on: ubuntu-latest
    # Scans the actual built image layers (base OS packages, installed
    # runtime, etc.) — a different surface than OWASP Dependency-Check
    # above, which only looks at declared source dependencies (pom.xml /
    # package.json) and never sees what ends up in the final container.
    strategy:
      matrix:
        service: [gateway-service, queue-service, result-service, notification-service, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sarthi/${{ matrix.service }}:scan ${{ matrix.service == 'frontend' && 'frontend' || format('backend/{0}', matrix.service) }}
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: sarthi/${{ matrix.service }}:scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
