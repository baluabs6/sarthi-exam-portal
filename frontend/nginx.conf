server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }

    # REST calls to the gateway
    location /api/ {
        proxy_pass http://gateway-service:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SECURITY: nginx is the actual internet-facing edge — this is the
        # one place in the whole system where "the client" might be a
        # genuine browser or might be an attacker directly connecting.
        # $proxy_add_x_forwarded_for APPENDS to whatever X-Forwarded-For
        # the client already sent, so a request arriving with
        # "X-Forwarded-For: 1.2.3.4" would be forwarded as
        # "1.2.3.4, <real client IP>" — every downstream service that
        # reads the FIRST entry (queue-service's lockout tracker,
        # result-service's CAPTCHA difficulty, the audit trail) would
        # trust the attacker-supplied value instead of the truth. Setting
        # it to $remote_addr instead discards anything the client sent
        # and uses only nginx's own, unforgeable view of who actually
        # connected.
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # WebSocket (STOMP/SockJS) upgrade to the gateway
    location /ws/ {
        proxy_pass http://gateway-service:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
    }
}
